<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff8c69"/>
      <stop offset="45%" stop-color="#e2583e"/>
      <stop offset="85%" stop-color="#a82315"/>
      <stop offset="100%" stop-color="#4a0f08"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#e2583e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e2583e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#glowGrad)" filter="url(#blur)"/>
  <!-- Planet Surface -->
  <circle cx="50" cy="50" r="38" fill="url(#marsGrad)"/>
  <!-- Crater Details -->
  <ellipse cx="40" cy="35" rx="8" ry="5" fill="#8c1b0f" opacity="0.5"/>
  <ellipse cx="62" cy="46" rx="6" ry="4" fill="#6d140a" opacity="0.6"/>
  <ellipse cx="46" cy="65" rx="10" ry="6" fill="#580f07" opacity="0.6"/>
  <ellipse cx="32" cy="55" rx="4" ry="2.5" fill="#8c1b0f" opacity="0.4"/>
  <!-- Atmosphere Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#ffaa90" stroke-width="1.5" opacity="0.4"/>
</svg>
