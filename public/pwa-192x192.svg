<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Atmospheric Halo Glow -->
    <radialGradient id="marsOuterHalo" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#ff7043" stop-opacity="0.45"/>
      <stop offset="84%" stop-color="#ff5722" stop-opacity="0.25"/>
      <stop offset="94%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Daylight Spherical Mars (Fiery terracotta to rich rust orange across entire disc) -->
    <radialGradient id="marsDaylight" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffa270"/>
      <stop offset="22%" stop-color="#ff7043"/>
      <stop offset="55%" stop-color="#ff5722"/>
      <stop offset="82%" stop-color="#e64a19"/>
      <stop offset="100%" stop-color="#d84315"/>
    </radialGradient>

    <!-- Sunlit Atmospheric Halo Rim (Amber/Gold to Radiant Cyan) -->
    <linearGradient id="marsAtmosphereRim" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="35%" stop-color="#ff8a65"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>

    <!-- Polar Ice Cap Gradient -->
    <linearGradient id="northPoleCap" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#e0f7fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Warm Martian Albedo Features (Warm reddish-brown #BF360C, never black) -->
    <radialGradient id="albedoWarm" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#bf360c" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#bf360c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d84315" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Planet Clip Path -->
    <clipPath id="planetDiscClip">
      <circle cx="256" cy="256" r="215"/>
    </clipPath>
  </defs>

  <!-- Sunlit atmospheric aura -->
  <circle cx="256" cy="256" r="248" fill="url(#marsOuterHalo)"/>

  <!-- Mars Planet Body -->
  <g clip-path="url(#planetDiscClip)">
    <!-- Base Daytime Spherical Surface (High saturation, no dark terminator) -->
    <circle cx="256" cy="256" r="215" fill="url(#marsDaylight)"/>

    <!-- Subtle Albedo Markings (Warm reddish-brown #BF360C) -->
    <!-- Syrtis Major -->
    <path d="M 125 215 C 155 175, 215 190, 245 210 C 275 230, 295 260, 315 280 C 285 310, 235 320, 185 305 C 140 290, 115 245, 125 215 Z" fill="url(#albedoWarm)"/>
    <!-- Acidalia Planitia -->
    <path d="M 290 150 C 330 135, 385 145, 415 175 C 405 200, 360 220, 320 200 C 285 185, 275 165, 290 150 Z" fill="url(#albedoWarm)"/>
    <!-- Southern Mare Highlands Band -->
    <path d="M 175 345 C 245 325, 325 345, 375 385 C 335 415, 245 425, 180 395 C 150 375, 150 355, 175 345 Z" fill="url(#albedoWarm)"/>

    <!-- Prominent Valles Marineris Canyon Slash -->
    <!-- Deep chasm in warm reddish-brown #BF360C -->
    <path d="M 155 254 Q 215 268 260 262 T 355 283 Q 405 294 425 308 Q 400 320 345 302 T 255 280 Q 205 284 155 266 Z" fill="#bf360c"/>
    <!-- Canyon north rim sunlit crest highlight (#FFCCBC) -->
    <path d="M 156 253 Q 215 267 260 261 T 355 282 Q 405 293 425 307" stroke="#ffccbc" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Branching chasmas -->
    <path d="M 235 265 Q 252 288 270 298" stroke="#bf360c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 315 276 Q 332 294 350 300" stroke="#bf360c" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Shield Caldera / Olympus Mons -->
    <circle cx="160" cy="178" r="26" fill="#e64a19" stroke="#ffab91" stroke-width="2.5"/>
    <ellipse cx="160" cy="178" rx="8" ry="6" fill="#bf360c" stroke="#ffccbc" stroke-width="1.5"/>

    <!-- Impact Craters -->
    <ellipse cx="345" cy="355" rx="34" ry="22" fill="#d84315" stroke="#ffab91" stroke-width="2.5"/>
    <ellipse cx="347" cy="357" rx="22" ry="14" fill="#bf360c"/>
    <circle cx="282" cy="176" r="14" fill="#d84315" stroke="#ffab91" stroke-width="1.8"/>
    <circle cx="283" cy="177" r="8" fill="#bf360c"/>

    <!-- North Polar Ice Cap (Pure white with subtle cyan frost rim) -->
    <!-- Cyan frost rim -->
    <ellipse cx="256" cy="62" rx="82" ry="28" fill="#80deea" opacity="0.85"/>
    <!-- Frosted ice transition -->
    <ellipse cx="256" cy="58" rx="70" ry="24" fill="url(#northPoleCap)"/>
    <!-- Pure brilliant white core -->
    <ellipse cx="256" cy="52" rx="54" ry="16" fill="#ffffff"/>
    <ellipse cx="250" cy="48" rx="34" ry="10" fill="#ffffff"/>
  </g>

  <!-- Sunlit Atmospheric Halo Rim (Amber/gold to glowing cyan edge) -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#marsAtmosphereRim)" stroke-width="6.5"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#ffe082" stroke-width="1.5" opacity="0.6"/>
</svg>